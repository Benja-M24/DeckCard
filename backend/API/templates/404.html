<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - DeckCard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .error-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #dc3545;
        }
        p {
            font-size: 1.1em;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .card-image {
            font-size: 5em;
            margin-bottom: 20px;
            color: #dc3545;
        }
        .back-link {
            display: inline-block;
            background-color: #0d6efd;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .back-link:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="card-image">🃏</div>
        <h1>404 - Página no encontrada</h1>
        <p>Lo sentimos, la carta que estás buscando no está en este mazo.</p>
        <p>Es posible que la URL esté mal escrita o que la página se haya movido o eliminado.</p>
        <a href="/" class="back-link">Volver al Inicio</a>
    </div>
</body>
</html>
